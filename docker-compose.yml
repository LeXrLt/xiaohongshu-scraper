services:
  postgres:
    image: postgres:16-alpine
    container_name: xhs-reader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - xhs_reader_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    container_name: xhs-reader-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      # 容器之间使用 PostgreSQL 的内部端口，宿主机端口可单独映射。
      POSTGRES_PORT: 5432
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./web/frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        API_AUTH_KEY: ${API_AUTH_KEY:?Set API_AUTH_KEY in .env}
        BACKEND_URL: http://api:8000
    container_name: xhs-reader-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api

volumes:
  xhs_reader_pgdata:
